name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/아카이브/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/아카이브/package-lock.json

      - name: 의존성 설치
        working-directory: apps/아카이브
        run: npm ci --no-audit --no-fund

      - name: 빌드 (REACT_APP_API_URL="" → 동일 호스트 relative)
        working-directory: apps/아카이브
        env:
          REACT_APP_API_URL: ''
          CI: 'false'
        run: npm run build

      - name: 빌드 아카이브
        working-directory: apps/아카이브
        run: tar -czf /tmp/frontend.tgz -C build .

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.EC2_PORT }} -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 서버로 전송
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ secrets.EC2_PORT }} \
            /tmp/frontend.tgz \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/frontend.tgz

      - name: 서버에서 배포
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.EC2_PORT }} \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo rm -rf /var/www/newstory/* && sudo tar -xzf /tmp/frontend.tgz -C /var/www/newstory && sudo chown -R www-data:www-data /var/www/newstory && rm /tmp/frontend.tgz && sudo systemctl reload nginx"
